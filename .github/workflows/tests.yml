name: Tests

on:
  pull_request:
    branches: [main, development]

env:
  ACERVO_APP_GROUP_ID: group.intrusive-memory.models

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: make resolve

      - name: Run unit tests
        run: make test-unit

  integration-tests:
    name: Integration Tests (compiled binary)
    runs-on: macos-26
    timeout-minutes: 30
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Build apoderado CLI (release)
        run: make release

      - name: Smoke-test compiled binary
        run: ./bin/apoderado --help

      - name: Run binary integration tests
        run: make test-integration
